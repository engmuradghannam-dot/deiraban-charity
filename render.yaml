services:
  # ---- Backend: Django API ----
  - type: web
    name: deraban-backend
    runtime: python
       rootDir: backend
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate && python manage.py import_members"
    startCommand: "gunicorn deraban.wsgi:application"
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "0"
      - key: CORS_ALLOWED_ORIGINS
        sync: false

  # ---- Frontend: React (Static Site) ----
  - type: web
    name: deraban-frontend
    runtime: static
    rootDir: frontend
    buildCommand: "npm install && npm run build"
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html